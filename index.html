<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>ELLY.ia</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ELLY.ia">
<meta name="theme-color" content="#0b0912">
<style>
:root{--bg:#0b0912;--card:#15111f;--bd:#2b2145;--tx:#f1ecfa;--mu:#9d93b8;--pr:#9b5cf6;--pr2:#c04bd8}
:root[data-t=light]{--bg:#f6f3fb;--card:#fff;--bd:#d9d0ec;--tx:#1b1530;--mu:#6b6285}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;-webkit-user-select:none;user-select:none}
textarea,input{-webkit-user-select:text;user-select:text}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);max-width:720px;margin:auto;background:radial-gradient(circle at 50% 0,#2a1550 0,transparent 60%)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
.logo{font:italic 22px Georgia,serif;letter-spacing:3px;color:#c9a8ff}.logo b{color:var(--pr2)}
main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--bd);background:var(--bg);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;padding:4px}nav button span{display:block;font-size:19px}nav .on{color:var(--pr);font-weight:700}
h1{font:600 28px Georgia,serif;letter-spacing:1px;margin:4px 0;text-transform:uppercase}h2{font-size:16px;margin:0 0 8px}
p.s{color:var(--mu);margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#3b1d70,#4a1a52 70%,#15111f);border-radius:22px;padding:20px;margin-bottom:14px}
.btn{background:linear-gradient(135deg,var(--pr),#7c3aed);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:0 0 18px #9b5cf655;cursor:pointer}
.btn.g{background:none;border:1px solid var(--bd);color:var(--tx);box-shadow:none}.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.w{width:100%;margin-top:8px}
input,textarea,select{width:100%;background:#0d0a16;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px;font:inherit;margin:4px 0 10px}
:root[data-t=light] input,:root[data-t=light] textarea,:root[data-t=light] select{background:#faf8ff}
textarea{min-height:80px;resize:vertical}label{font-weight:600;font-size:14px}small,.mu{color:var(--mu);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--bd);border-radius:20px;padding:7px 13px;background:none;color:var(--mu);cursor:pointer;font-size:13px}.chip.on{border-color:var(--pr);color:var(--tx);background:#2a1a4d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{margin:14px 0}.bub{padding:11px 13px;border-radius:14px;background:var(--card);border:1px solid var(--bd);white-space:pre-wrap;line-height:1.5}
.msg.u .bub{background:#4c2a96;border-color:#6b3fd0;margin-left:30px}.acts{display:none;gap:4px;flex-wrap:wrap;margin-top:4px}.acts.show{display:flex}.bub{-webkit-touch-callout:none}main{min-height:0}.cw{flex:none;padding:0 16px 6px;background:var(--bg)}.acts button{background:none;border:0;color:var(--mu);font-size:12px;padding:4px 6px;cursor:pointer}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:9}.mod>div{background:var(--card);width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.tag{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}.tag.off{opacity:.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pr);color:#fff;padding:9px 16px;border-radius:20px;z-index:20}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.comp{display:flex;gap:8px;padding:8px 0 4px}.comp textarea{margin:0;min-height:44px;max-height:120px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const D=()=>({stories:[],chars:[],cinema:[],providers:[],profile:{name:'',theme:'dark',len:'longa',persp:'terceira'},age:false});
let ME=localStorage.getItem('elly_me')||'',S=D();
const load=()=>{try{Object.assign(S,JSON.parse(localStorage.getItem('elly:'+ME)||'{}'))}catch(e){}};load();S.providers.forEach(fixP);
const save=()=>{try{localStorage.setItem('elly:'+ME,JSON.stringify(S))}catch(e){}};
let R={v:'home',tab:'min',id:null,mid:null},busy=false;
const go=(v,id,tab)=>{R={v,id:id||null,tab:tab||R.tab};render()};
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
const MODES=['Fanfic','RPG','COSMOS','Batalha','Romance','Dark Romance','Drama','Suspense','Fantasia','Comédia','Realismo','Terror','História original'];
const INT=[['Drama leve','Conflitos moderados, tom confortável, foco em relações.'],['Realismo psicológico','Reações complexas, contradições, consequências realistas.'],['Narrativa sombria','Clima tenso, segredos, perdas e dilemas morais.'],['Drama extremamente intenso','Crises, rupturas, luto e consequências profundas.']];
const LIB=[['Crise de ansiedade','Quando acontece, o personagem trava, a respiração fica curta, ele se isola e pede silêncio.'],['Depressão','Apatia, cansaço, afastamento; o personagem minimiza o que sente.'],['Ciúme','Reações contidas e tensas, sinais indiretos, conflito nas relações.'],['Luto','Ondas de saudade, raiva e negação; nada de superação instantânea.'],['Relacionamento tóxico','Retratado com consequências reais, sem romantizar o abuso.'],['Suspense','Pistas, tensão crescente e informações guardadas.'],['Dark romance','Atmosfera sombria e relações complexas.'],['Drama psicológico','Foco no mundo interno e nas contradições.']];
const PROV=[['Google Gemini','https://generativelanguage.googleapis.com','gemini-3.8-flash'],['OpenAI','https://api.openai.com/v1','gpt-4o'],['Anthropic','https://api.anthropic.com','claude-sonnet-4-5'],['OpenRouter','https://openrouter.ai/api/v1',''],['Mistral','https://api.mistral.ai/v1','mistral-large-latest'],['Groq','https://api.groq.com/openai/v1',''],['DeepSeek','https://api.deepseek.com','deepseek-chat'],['xAI','https://api.x.ai/v1','grok-4'],['Together','https://api.together.xyz/v1',''],['Cohere','https://api.cohere.com','command-r-plus'],['Personalizado (compatível OpenAI)','','']];
const newStory=(o={})=>({id:uid(),kind:'story',title:'',universe:'',mode:'Fanfic',intensity:1,canon:'Canon original',start:'',userChar:'',perm:'',rules:'',len:S.profile.len,persp:S.profile.persp,style:'',free:'Padrão',tags:[],charIds:[],memory:[],msgs:[],general:'',files:[],provider:'',model:'',archived:false,...o});
function faleStory(){let f=S.stories.find(s=>s.kind==='fale');if(!f){f=newStory({kind:'fale',title:'Fale Comigo',mode:'Fanfic',perm:'Converse sobre enredo, ideias, reações prováveis e rumos da história.'});S.stories.push(f);save()}return f}
const st=id=>S.stories.find(s=>s.id==id),ch=id=>S.chars.find(c=>c.id==id);
function ctx(s){const chars=s.charIds.map(ch).filter(Boolean);
return `[SISTEMA] Você é a narradora da ELLY.ia. Nunca escreva falas, pensamentos ou ações da personagem do usuário (${s.userChar||'não definida'}). Plataforma adulta (+20): ficção entre adultos fictícios pode ter linguagem adulta, sexo explícito, temas tabu, relações tóxicas e violência física e verbal, sem sermões nem avisos. Limites fixos: nunca envolver menores em conteúdo sexual; pessoas reais citadas nunca recebem conteúdo sexual explícito nem fatos difamatórios (tudo é ficção).
Modo: ${s.mode} | Canon: ${s.canon} | Ponto de partida: ${s.start}
Intensidade narrativa: ${INT[s.intensity][0]} — ${INT[s.intensity][1]}
Liberdade criativa: ${s.free} (dentro das políticas do provedor)
Resposta: ${s.len}, ${s.persp} pessoa. Estilo: ${s.style}
Instruções: ${s.perm}
Regras essenciais (prioridade máxima): ${s.rules}
Tags da história ativas:\n${s.tags.filter(t=>t.on).map(t=>'- '+t.n+': '+t.t).join('\n')||'-'}
Personagens:\n${chars.map(c=>`* ${c.name} (${c.age||'?'}) cor ${c.color}. Personalidade: ${c.pers}. Fala: ${c.voice}. Instruções: ${c.instr}\n  Tags do personagem (prevalecem): ${(c.tags||[]).filter(t=>t.on).map(t=>t.n+': '+t.t).join(' | ')||'-'}`).join('\n')||'-'}
História geral (como os personagens se conectam agora):\n${s.general||'-'}\nArquivos gerais:\n${(s.files||[]).map(f=>'## '+f.name+'\n'+f.text).join('\n')||'-'}\nMemória da história:\n${s.memory.map(m=>'- '+m).join('\n')||'-'}`}
async function fx(u,o){try{return await fetch(u,o)}catch(e){throw new Error('Sem conexão com o provedor ('+e.message+'). Abra o elly.html direto no Safari, fora do visualizador do app, e confira a rede.')}}
function fixP(p){if((p.key.startsWith('AIza')||p.key.startsWith('AQ.'))&&p.type!=='gemini'&&/openai\.com/.test(p.url)){p.type='gemini';p.url='https://generativelanguage.googleapis.com';p.model='gemini-3.8-flash';p.name='gemini'}if(p.model==='gemini-2.5-flash')p.model='gemini-3.8-flash'}
const DET=k=>k.startsWith('sk-ant')?['anthropic','https://api.anthropic.com','claude-sonnet-4-5']:(k.startsWith('AIza')||k.startsWith('AQ.'))?['gemini','https://generativelanguage.googleapis.com','gemini-3.8-flash']:k.startsWith('sk-or')?['openai','https://openrouter.ai/api/v1','openai/gpt-4o']:k.startsWith('gsk_')?['openai','https://api.groq.com/openai/v1','llama-3.3-70b-versatile']:k.startsWith('xai-')?['openai','https://api.x.ai/v1','grok-4']:['openai','https://api.openai.com/v1','gpt-4o'];
async function gen(s,hist,on){const p=S.providers[+s.provider||0];if(!p)throw new Error('Adicione sua chave em Perfil › Configurações de IA.');
const sys=ctx(s),h=hist.map(x=>({role:x.role==='user'?'user':'assistant',content:x.vers[x.vi]}));if(!h.length)h.push({role:'user',content:'Comece a história.'});
let url,hd={'Content-Type':'application/json'},body;
if(p.type==='anthropic'){url=p.url+'/v1/messages';hd['x-api-key']=p.key;hd['anthropic-version']='2023-06-01';hd['anthropic-dangerous-direct-browser-access']='true';body={model:p.model,max_tokens:16000,stream:true,system:sys,messages:h}}
else if(p.type==='gemini'){url=`${p.url}/v1beta/models/${p.model}:streamGenerateContent?alt=sse&key=${p.key}`;body={systemInstruction:{parts:[{text:sys}]},contents:h.map(x=>({role:x.role==='user'?'user':'model',parts:[{text:x.content}]})),safetySettings:['HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH','HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT'].map(c=>({category:c,threshold:'BLOCK_NONE'}))}}
else{url=p.url+'/chat/completions';hd.Authorization='Bearer '+p.key;body={model:p.model,stream:true,messages:[{role:'system',content:sys},...h]}}
const r=await fx(url,{method:'POST',headers:hd,body:JSON.stringify(body)});
if(!r.ok){let t='';try{t=(await r.json()).error?.message}catch(e){}throw new Error(r.status===401||r.status===403?'Chave inválida ou sem permissão.':r.status===429?'Quota ou limite do provedor atingido.':t||'Erro '+r.status)}
const rd=r.body.getReader(),dc=new TextDecoder();let buf='',out='';
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;try{const j=JSON.parse(d);const t=p.type==='anthropic'?(j.delta?.text||''):p.type==='gemini'?(j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||''):(j.choices?.[0]?.delta?.content||'');if(t){out+=t;on(out)}}catch(e){}}}
return out}
async function sendAI(s,msg){const m=msg||{id:uid(),role:'ai',vers:[''],vi:0};if(msg){m.vers.push('');m.vi=m.vers.length-1}else s.msgs.push(m);
const hist=s.msgs.slice(0,s.msgs.indexOf(m));render();
try{const t=await gen(s,hist,o=>{m.vers[m.vi]=o;const e=document.getElementById('b'+m.id);if(e)e.textContent=o;const c=$('#msgs');if(c)c.scrollTop=c.scrollHeight});if(!t)throw new Error('Resposta vazia (o provedor pode ter bloqueado).')}catch(e){m.vers[m.vi]='⚠ '+e.message}save();render()}
/* tags */
const tg=sc=>sc==='s'?st(R.id).tags:ch(sc).tags;
function tagEd(sc){const L=tg(sc)||[];return `<div>${L.map((t,i)=>`<div class="tag ${t.on?'':'off'}"><div class="row"><input style="flex:1;margin:0" value="${esc(t.n)}" onchange="tg('${sc}')[${i}].n=this.value;save()"><button class="btn g sm" onclick="tgOp('${sc}',${i},'on')">${t.on?'Ativa':'Off'}</button></div><small>Como isso funciona${sc==='s'?' na história':' neste personagem'}</small><textarea onchange="tg('${sc}')[${i}].t=this.value;save()">${esc(t.t)}</textarea><div class="row"><button class="btn g sm" onclick="tgOp('${sc}',${i},'up')">↑</button><button class="btn g sm" onclick="tgOp('${sc}',${i},'dn')">↓</button><button class="btn g sm" onclick="tgOp('${sc}',${i},'dup')">Duplicar</button><button class="btn g sm" onclick="tgOp('${sc}',${i},'del')">Excluir</button></div></div>`).join('')||'<p class="mu">Nenhuma tag.</p>'}
<label>Biblioteca (editável depois)</label><div class="chips">${LIB.map((l,i)=>`<button class="chip" onclick="tgAdd('${sc}',${i})">+ ${l[0]}</button>`).join('')}<button class="chip" onclick="tgAdd('${sc}',-1)">+ Nova tag</button></div></div>`}
function tgAdd(sc,i){const t=i<0?{n:'Nova tag',t:''}:{n:LIB[i][0],t:LIB[i][1]};tg(sc).push({...t,on:true});save();refreshTags(sc)}
function tgOp(sc,i,op){const L=tg(sc);if(op==='on')L[i].on=!L[i].on;if(op==='del')L.splice(i,1);if(op==='dup')L.splice(i+1,0,{...L[i],n:L[i].n+' (cópia)'});if(op==='up'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];if(op==='dn'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];save();refreshTags(sc)}
function refreshTags(sc){const e=$('#tg-'+sc);if(e)e.innerHTML=tagEd(sc)}
/* modal */
function modal(h){const m=document.createElement('div');m.className='mod';m.innerHTML='<div>'+h+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const closeM=()=>document.querySelectorAll('.mod').forEach(m=>m.remove());
/* views */
function head(){return `<header><span class="logo">ELLY<b>.</b>ia</span><button class="chip" onclick="go('profile')">👤</button></header>`}
const NAV=[['home','⌂','Início'],['stories','📖','Histórias'],['chars','👥','Personagens'],['fale','✦','Fale'],['tutorial','🧭','Tutorial'],['profile','👤','Perfil']];
function render(){document.documentElement.dataset.t=S.profile.theme;if(!ME)return loginV();
if(R.v==='fale'){const f=faleStory();R={v:'chat',id:f.id}}
const act=['chat','newstory'].includes(R.v)?(st(R.id)?.kind==='fale'?'fale':'stories'):(R.v==='newchar'||R.v==='dev')?'chars':R.v;
const v=VIEWS[R.v]?VIEWS[R.v]():'';
$('#app').innerHTML=head()+(R.v==='chat'?v:`<main>${v}</main>`)+`<nav>${NAV.map(n=>`<button class="${act===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`;
if(R.v==='chat'){const c=$('#msgs');if(c)c.scrollTop=c.scrollHeight}}
const empty=(t,d,b,f)=>`<div class="card" style="text-align:center;padding:30px 16px"><h2>${t}</h2><p class="mu">${d}</p>${b?`<button class="btn" onclick="${f}">${b}</button>`:''}</div>`;
const VIEWS={
home(){const n=S.profile.name.toUpperCase();return `<div class="hero"><small style="letter-spacing:2px;color:#c9a8ff">BEM-VINDA, ${esc(n)}</small><h1>Eu sou todas as escolhas e universos</h1><p class="s" style="color:#d9cdf5">Ordene ou mude o caos. Escolha um universo, chame seus personagens e escreva a próxima cena comigo.</p><button class="btn w" onclick="go('newstory')">+ Nova história</button><button class="btn g w" onclick="go('newstory',null);R.mode='RPG'">⚔ Novo RPG</button><p style="text-align:center;margin:12px 0 0"><a style="color:#d9cdf5" onclick="go('fale')">Falar sobre enredo →</a></p></div>
<div class="card" style="border-color:var(--pr)"><h2>🎭 Desenvolver personagem</h2><p class="mu">Pesquise uma pessoa famosa, combine informações reais com elementos fictícios e crie um personagem único para sua história.</p><button class="btn" onclick="go('dev')">Começar</button></div><div class="chips">${['Cinema','Batalha','Dark romance','Cosmos','Fandom','Fale comigo','Todos os modos'].map(c=>`<button class="chip" onclick="go('stories',null,'tpl')">${c}</button>`).join('')}</div>
<div class="grid"><div class="card" onclick="go('stories',null,'cin')"><h2>🎬 Cinema ELLY.ia</h2><small>Seus personagens assistindo outras realidades.</small></div><div class="card" onclick="go('stories',null,'conv')"><h2>💬 Conversas</h2><small>Chats individuais e grupos.</small></div><div class="card" onclick="go('stories',null,'tpl')"><h2>📖 Modo Fandom</h2><small>Temporadas, canon e cronologia.</small></div><div class="card" onclick="go('fale')"><h2>✦ Fale Comigo</h2><small>Ideias, reações e rumos de enredo.</small></div></div>
<div class="card"><h2>Personagens recentes</h2>${S.chars.slice(-3).map(c=>`<div><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</div>`).join('')||'<p class="mu">Sua biblioteca de personagens está vazia.</p>'}</div>
<div class="card"><h2>Histórias e RPGs</h2>${S.stories.filter(s=>s.kind!=='fale').slice(-3).map(s=>`<div onclick="go('chat','${s.id}')" style="padding:4px 0">${esc(s.title)}</div>`).join('')||'<p class="mu">Nenhuma história criada ainda.</p>'}</div>`},
stories(){const T=[['min','Minhas histórias'],['tpl','Modelos de escrita'],['cin','Cinema ELLY.ia'],['conv','Conversas'],['dir','História direta']];const t=R.tab;
const tabs=`<div class="chips">${T.map(x=>`<button class="chip ${t===x[0]?'on':''}" onclick="R.tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
let b='';
if(t==='min'){const q=(R.q||'').toLowerCase();const L=S.stories.filter(s=>s.kind!=='fale'&&s.kind!=='conv'&&!!s.archived===!!R.arch&&(s.title+s.universe).toLowerCase().includes(q));
b=`<h1>Histórias</h1><p class="s">Fanfics, RPGs e universos originais — cada um com memória, regras e personagens próprios.</p><button class="btn" onclick="go('newstory')">+ Nova história</button><div style="height:12px"></div>${tabs}<input placeholder="🔍 Buscar por título, universo ou pasta" oninput="R.q=this.value;render();this.focus()" value="${esc(R.q||'')}"><button class="btn g w" style="margin:0 0 12px" onclick="R.arch=!R.arch;render()">${R.arch?'Ver ativas':'Ver arquivadas'}</button>${L.map(s=>`<div class="card"><div onclick="go('chat','${s.id}')"><h2>${esc(s.title)}</h2><small>${esc(s.mode)} · ${esc(s.universe||'original')} · ${INT[s.intensity][0]}</small></div><div class="row" style="margin-top:8px"><button class="btn g sm" onclick="arch('${s.id}')">${s.archived?'Desarquivar':'Arquivar'}</button><button class="btn g sm" onclick="delS('${s.id}')">Excluir</button><button class="btn g sm" onclick="expS('${s.id}')">Exportar</button></div></div>`).join('')||empty('Sua primeira história começa agora','Escolha o modo, o universo e os personagens. A ELLY.ia lembra de tudo o que acontecer.','Criar história',"go('newstory')")}`}
if(t==='tpl'){const M=[['Fanfic de temporada','Fanfic','Comece em uma temporada específica e siga o canon com liberdade.'],['RPG de turnos','RPG','Você controla sua personagem; a ELLY.ia interpreta o resto do mundo.'],['COSMOS completo','COSMOS','Romance, ação, mistério e reviravoltas no mesmo universo.'],['Dark romance','Dark Romance','Segredos, obsessão e conflitos de confiança.'],['Batalha épica','Batalha','Coreografia clara, poderes e consequências.'],['Universo original','História original','Construa mundo, regras, culturas e conflitos.']];

async function ask(sys,user,search){const p=S.providers[0];if(!p)throw new Error('Adicione sua chave em Perfil › Configurações de IA.');let url,hd={'Content-Type':'application/json'},body,src=[];
if(p.type==='anthropic'){url=p.url+'/v1/messages';hd['x-api-key']=p.key;hd['anthropic-version']='2023-06-01';hd['anthropic-dangerous-direct-browser-access']='true';body={model:p.model,max_tokens:16000,system:sys,messages:[{role:'user',content:user}]}}
else if(p.type==='gemini'){url=`${p.url}/v1beta/models/${p.model}:generateContent?key=${p.key}`;body={systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:user}]}]};if(search)body.tools=[{google_search:{}}]}
else{url=p.url+'/chat/completions';hd.Authorization='Bearer '+p.key;body={model:p.model,messages:[{role:'system',content:sys},{role:'user',content:user}]}}
const r=await fx(url,{method:'POST',headers:hd,body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===401||r.status===403?'Chave inválida ou sem permissão.':j.error?.message||'Erro '+r.status);
let t;if(p.type==='anthropic')t=j.content.map(x=>x.text||'').join('');else if(p.type==='gemini'){const c=j.candidates?.[0];t=(c?.content?.parts||[]).map(x=>x.text||'').join('');src=(c?.groundingMetadata?.groundingChunks||[]).map(x=>x.web).filter(Boolean)}else t=j.choices?.[0]?.message?.content||'';
return{t,src,web:p.type==='gemini'&&!!search}}

function chTog(id){const s=st(R.sid),i=s.charIds.indexOf(id);i<0?s.charIds.push(id):s.charIds.splice(i,1);save()}
/* PWA */
